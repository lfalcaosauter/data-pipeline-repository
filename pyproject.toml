[project]
name = "data-pipeline"
version = "0.1.0"
description = "End-to-end data pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
    "faker>=40.38.0",
    "pandas",
    "psycopg2-binary",
    "psycopg[binary]>=3.3.5",
    "pyarrow>=25.0.1",
    "python-dotenv",
    "requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/bronze",
    "src/extraction",
    "src/generator",
    "src/silver",
    "src/gold",
    "src/utils",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260730",
    "pytest",
    "ruff",
    "types-psycopg2>=2.9.21.20260911",
]

[tool.ruff]
line-length = 100

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["src"]